# Example rlog configuration.
#
# Only settings that differ from rlog.DefaultConfig() are needed; everything
# is spelled out here to show what is available.
#
# ${NAME} is replaced by the environment variable NAME. The example program
# loads the secrets from .var (see .var.example) into the environment before
# reading this file, so no secrets live in this file.
#
# Every sink has two switches for what it receives:
#   level          the lowest level of log records it takes
#   notifications  whether it takes notifications (Notify, NotifyRaw, Send);
#                  leaving it out means true

program: example

format:
  time: full            # full | datetime | short | time | timems | date | rfc3339 | rfc3339nano | iso8601 | unix | unixms | none | a Go layout
  utc: false
  source: short         # "" (off) | short | full
  level: true
  component: true
  program: true

console:
  enabled: true
  level: debug
  json: false
  color: auto           # never | auto | always
  notifications: true   # shown as NOTE lines

file:
  enabled: true
  level: info
  json: true            # the file gets JSON lines, the console gets text
  notifications: true
  path: logs/example.log
  max_size_mb: 100
  daily: true
  max_backups: 7
  compress: true

repeats:                # identical records or notifications within the window are grouped
  enabled: true
  window: 2s

queue_size: 100         # per service; when full, new items are dropped
notify_timeout: 15s     # limit on one send to a service
close_timeout: 10s      # how long Close waits for the queues to empty

# The services. One whose secrets are missing from .var is turned off by
# the example program, so you can test one service at a time.

telegram:
  enabled: true
  level: error
  notifications: true
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}

pushover:
  enabled: true
  level: error
  notifications: true
  token: ${PUSHOVER_TOKEN}
  user: ${PUSHOVER_USER}
  priorities: {WARN: 0, ERROR: 1}

email:
  enabled: true
  level: error
  notifications: true
  host: ${SMTP_HOST}
  port: 587             # 587 starttls, 465 tls, 25 none
  security: starttls    # starttls | tls | none
  username: ${SMTP_USERNAME}
  password: ${SMTP_PASSWORD}
  from: ${EMAIL_FROM}
  to:
    - ${EMAIL_TO}
